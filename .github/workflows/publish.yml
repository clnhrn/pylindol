name: Publish to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pylindol/${{ github.ref_name }}/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.13"

      - name: Check the tag matches the package version
        run: test "$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Build package
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl pylindol --version
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import pylindol; print(pylindol.__version__)"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(uvx --from commitizen==4.19.2 cz changelog "$VERSION" --dry-run)
          gh release create "$VERSION" dist/* --title "$VERSION" --notes "$NOTES"
